abstract: 'Worked design example (McCormac & Brown, Design of Reinforced Concrete,
  9th ed., Example 18.1) of a load-bearing concrete wall by the ACI empirical
  method (ACI 318 §14.5.2, Eq. 14-1 — the direct predecessor of ACI 318-19
  §11.5.3.1). Supplies an independent numeric known-answer oracle for the
  simplified/empirical bearing-wall axial capacity implemented in
  StructuralSizer/src/walls/bearing.jl.'
