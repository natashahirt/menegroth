  - {from: wall.thickness_jump.apply, to: slab.flat_plate.punching, kind: data, var: wall.t}  # missing: slab not restaled on wall jump
  # foundations
  - {from: pipeline.walls, to: fdn.stage, kind: control}
  - {from: wall.lateral_analysis, to: fdn.support_demands, kind: data, var: none}  # missing: lateral reactions never stored on main
  - {from: fdn.support_demands, to: fdn.grade_walls, kind: data, var: demand.wall_line.Pu}
  - {from: fdn.grade_walls, to: fdn.wall_strip, kind: call}
  - {from: fdn.grade_walls, to: fdn.mat, kind: call}
  - {from: fdn.support_demands, to: fdn.strategy, kind: data, var: demand.fdn.Ps}
  - {from: fdn.strategy, to: fdn.spread, kind: control}
  - {from: fdn.strategy, to: fdn.strip, kind: control}
  - {from: fdn.strategy, to: fdn.mat, kind: control}
  - {from: fdn.support_demands, to: fdn.loop.reaction_grouping, kind: data, var: demand.fdn.Pu}
  - {from: fdn.loop.reaction_grouping, to: fdn.group_envelope, kind: data, var: fdn.group_id}
  - {from: fdn.group_envelope, to: fdn.spread, kind: data, var: demand.fdn.Pu}
  - {from: fdn.mat.rigid_strips, to: fdn.mat.rigid_gate, kind: data, var: fdn.h}
