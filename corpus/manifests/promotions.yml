- id: asce-7-22-12.3.1
  clause: "ASCE 7-22 §12.3.1"
  page: 179
  char_start: 741048
  status: accepted
  requirement: >
    The analysis shall consider the relative stiffnesses of diaphragms and
    the vertical elements of the seismic force-resisting system. Unless a
    diaphragm can be idealized as flexible or rigid per §12.3.1.1, §12.3.1.2,
    or §12.3.1.3, the analysis shall include the diaphragm stiffness
    (semirigid).

- id: asce-7-22-12.3.1.1
  clause: "ASCE 7-22 §12.3.1.1"
  page: 179
  char_start: 741597
  status: accepted
  requirement: >
    Untopped steel decking or wood structural panels are permitted to be
    idealized as flexible where (1) the vertical elements are steel braced
    frames, steel and concrete composite braced frames, or concrete, masonry,
    steel, or composite shear walls; or (2) the building is a one- or
    two-family dwelling; or (3) light-frame construction with no concrete
    topping over wood panels except nonstructural topping not greater than
    1.5 in. (38 mm), and each line of vertical elements complies with
    Table 12.12-1.

- id: asce-7-22-12.3.1.2
  clause: "ASCE 7-22 §12.3.1.2"
  page: 179
  char_start: 742420
  status: accepted
  requirement: >
    Diaphragms of concrete slabs or concrete-filled metal deck with
    span-to-depth ratios of 3 or less, in structures that do not have a
    Type 2, 3, 4, or 5 horizontal structural irregularity, are permitted
    to be idealized as rigid.

- id: asce-7-22-12.3.1.3
  clause: "ASCE 7-22 §12.3.1.3 Eq. 12.3-1"
  page: 179
  char_start: 742680
  status: accepted
  requirement: >
    A diaphragm that meets neither §12.3.1.1 nor §12.3.1.2 is permitted to
    be idealized as flexible where δ_MDD / Δ_ADVE > 2. δ_MDD and Δ_ADVE are
    as shown in Figure 12.3-1. The loading shall be that prescribed in §12.8.

- id: asce-7-22-12.3.2
  clause: "ASCE 7-22 §12.3.2.1 and Table 12.3-1"
  page: 180
  char_start: 744899
  status: accepted
  requirement: >
    Horizontal irregularity exists where any Table 12.3-1 type is present.
    Type 1 torsional: more than 75% of any story's lateral strength below
    the diaphragm is on one side of the center of mass, or TIR = Δmax/Δavg
    exceeds 1.2 (Eq. 12.3-2). TIR uses ELF forces per §12.8 with accidental
    torsion per §12.8.4 and Ax = 1.0. Type 2 reentrant corner: both plan
    projections beyond the corner are greater than 20% of the plan dimension
    in that direction. Type 3 diaphragm discontinuity: a cutout or open area
    greater than 25% of the gross enclosed diaphragm area, or a change in
    effective diaphragm stiffness of more than 50% from one story to the
    next. Type 4 out-of-plane offset: a discontinuity in a lateral
    force-resistance path, such as an out-of-plane offset of at least one
    vertical element. Type 5 nonparallel system: vertical lateral
    force-resisting elements are not parallel to the major orthogonal axes.

- id: asce-7-22-26.2-diaphragm
  clause: "ASCE 7-22 §26.2 DIAPHRAGM (wind)"
  page: 324
  char_start: 1394451
  status: accepted
  requirement: >
    For analysis under wind loads, diaphragms of untopped steel decks,
    concrete-filled steel decks, and concrete slabs, each with a
    span-to-depth ratio of 2 or less, shall be permitted to be idealized
    as rigid. Diaphragms of wood structural panels are permitted to be
    idealized as flexible.

- id: asce-7-22-12.7.2
  clause: "ASCE 7-22 §12.7.2"
  page: 184
  char_start: 769295
  status: accepted
  requirement: >
    W includes the dead load above the base, plus: (1) in storage areas, a
    minimum of 25% of the floor live load; (2) the actual partition weight
    or 10 lb/ft2 (0.48 kN/m2), whichever is greater, where partitions are
    provided or required by §4.3.2; (3) total operating weight of permanent
    equipment; (4) where the flat roof snow load Pf exceeds 45 lb/ft2
    (2.16 kN/m2), 15% of the uniform design snow load, regardless of roof
    slope; (5) landscaping and similar roof-garden materials per §3.1.4;
    (6) fluids and bulk material expected during normal use. Exceptions:
    items 1, 3, 5, and 6 need not be included where they add no more than
    5% to the effective seismic weight at that level; floor live load in
    public garages and open parking structures need not be included; fluid
    weight may be reduced by a rational fluid-structure interaction analysis.

