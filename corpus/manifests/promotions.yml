- id: asce-7-22-12.8.3
  clause: "ASCE 7-22 §12.8.3 Eqs. 12.8-12 and 12.8-13"
  page: 186
  char_start: 780449
  status: accepted
  requirement: >
    Eq. 12.8-12 reads Fx = CvxV. On PDF page 186 the numerator of
    Eq. 12.8-13 is wx hx^k and the denominator is a summation of
    wi hi^k. The printed limits have i=1 above the summation sign and n
    below it. That order is confirmed by the glyph positions, a crop of
    the sign alone, and the page image. Figure C12.8-3 prints the usual
    sum, with n above the sign and i=1 below it. ASCE 7-16 Eq. 12.8-12
    (source_id asce-7-16, PDF page 157) prints the same equation with n
    above and i=1 below, confirmed from the glyph positions. User decision,
    2026-10-23: encode the sum over every level, i = 1 to n. Code that
    uses it must quote the printed 7-22 form and mark this reading as
    engineering judgment. The exponent
    k is readable:
    k = 1 when T <= 0.5 s; k = 2 when T >= 2.5 s; between those periods,
    k shall be 2 or shall be linear interpolation between 1 and 2.
    wi and wx are the portions of W assigned to levels i and x. hi and hx
    are the heights from the base to those levels.

- id: asce-7-22-12.8.4.2
  clause: "ASCE 7-22 §12.8.4.2"
  page: 187
  char_start: 782453
  status: accepted
  requirement: >
    Where diaphragms are not flexible, accidental torsion is applied to
    determine whether a horizontal irregularity exists. It is included in
    analysis and design for: Seismic Design Category B with Type 1
    irregularity and TIR > 1.4; and Seismic Design Category C, D, E, or F
    with Type 1 irregularity. Where required, Mta is combined with the
    inherent torsional moment Mt, and is determined by displacing the
    center of mass each way by 5% of the dimension perpendicular to the
    applied forces. Concurrent orthogonal earthquake forces do not require
    the 5% displacement in both directions at once; apply it in the
    direction that produces the greater effect for each element.
    For flexible diaphragms, §12.8.4.1 distributes forces by the position
    of the masses supported, not by this accidental torsion.

- id: asce-7-22-12.8.4.3
  clause: "ASCE 7-22 §12.8.4.3 Eq. 12.8-15"
  page: 187
  char_start: 784323
  status: accepted
  requirement: >
    Applies to Seismic Design Category C, D, E, or F with Type 1
    irregularity. Ax shall not be less than 1 and is not required to exceed
    3.0. δmax and δavg may be computed assuming the diaphragm is rigid and
    assuming Ax = 1. Read from PDF page 187, Eq. 12.8-15 is
    Ax = (δmax / (1.2 δavg))^2. The text extract leaves the exponent on
    the line above the fraction; the page places the 2 to the right of
    the closing fence.

- id: asce-7-22-12.8.6
  clause: "ASCE 7-22 §12.8.6"
  page: 187
  char_start: 785043
  status: accepted
  requirement: >
    Displacements and drifts use the §12.8 seismic design forces with a
    load factor of 1.0 on Eh, together with expected gravity not less than
    1.0D + 0.5L. L is 0.8*L0 where the unreduced design live load exceeds
    100 lb/ft2 (4.79 kN/m2), and 0.4*L0 otherwise. Eq. 12.8-6 need not be
    considered when computing drift. The period used for displacements may
    omit the Cu*Ta upper limit of §12.8.2. Design story drift Δ (§12.8.6.5,
    page 188) is the difference of the Design Earthquake Displacements at
    the centers of mass at the top and bottom of the story. Where those
    centers do not align, the bottom deflection may be taken at the vertical
    projection of the upper center of mass. Diaphragm deformation may be
    neglected. For Seismic Design Category C, D, E, or F with Type 1
    irregularity, Δ is the largest difference of vertically aligned
    displacements along any edge, including diaphragm rotation.
    Eq. 12.8-16 now reads δDE = Cdδe/Ie þ δdi. The þ is the plus sign in
    this font's mapping. Eq. 12.8-17 reads δMCE = 1.5 Rδe/Ie þ δdi.

- id: asce-7-22-12.12.1
  clause: "ASCE 7-22 §12.12.1 and Table 12.12-1"
  page: 194
  char_start: 825377
  status: accepted
  requirement: >
    Design story drift Δ from §12.8.6, §12.9.1, or §12.9.2 shall not exceed
    Δa from Table 12.12-1 (page 195). Recovered row order, hsx = story
    height below level x. Four stories or less, not masonry shear walls,
    with interior walls, partitions, and ceilings designed to accommodate
    the Design Earthquake Displacements: 0.025 hsx, 0.020 hsx, 0.015 hsx
    for Risk Category I or II, III, IV. Masonry cantilever shear walls:
    0.010 hsx for I-IV. Other masonry shear walls: 0.007 hsx for I-IV.
    All other structures: 0.020 hsx, 0.015 hsx, 0.010 hsx for I or II, III,
    IV. For seismic force-resisting systems solely comprising moment frames
    in Seismic Design Category D, E, or F, Δ shall not exceed Δa/ρ
    (§12.12.1.1).

- id: asce-7-22-12.8.7
  clause: "ASCE 7-22 §12.8.7 Eqs. 12.8-18 and 12.8-19"
  page: 188
  char_start: 789216
  status: accepted
  requirement: >
    P-delta on story shears, moments, member forces, and story drifts is
    not required where the stability coefficient θ is less than or equal
    to 0.10. Eq. 12.8-18 reads θ = (Px∕hsx)/(Vx∕Δxe). Eq. 12.8-19 reads
    θmax = 0.5/βCd ≤ 0.25. θ shall not exceed θmax, and θmax from
    Eq. 12.8-19 need not be taken less than 0.1.
    β may be taken as 1.0 and shall not be taken less than 1.25/Ω0.
    Where 0.10 < θ <= θmax, displacements and member forces may be
    multiplied by 1/(1 − θ). Where θ > θmax, the structure shall be
    redesigned. Px uses the §12.8.6.1 gravity with no individual load
    factor exceeding 1.0. Story stiffness is Vx/Δxe at the §12.8.6.5
    location and may neglect diaphragm deformation.

