    open buildings, and for negative internal pressure in partially
    enclosed buildings. qi = qz for positive internal pressure in partially
    enclosed buildings, with z at the highest opening that could affect
    that pressure. Eq. 27.3-2, PDF page 347, is p = qh Kd G CN for open
    buildings with monoslope, pitched, or troughed free roofs. Table 27.2-1
    steps 1 through 8 name the inputs (Chapter 26) and say step 7 uses
    Eq. 27.3-1 or Eq. 27.3-2. §27.1.5 minimums: enclosed or partially
    enclosed, not less than 16 lb/ft2 (0.77 kN/m2) times the wall area and
    8 lb/ft2 (0.38 kN/m2) times the roof area projected on a vertical plane
    normal to the wind; open buildings, not less than 16 lb/ft2
    (0.77 kN/m2) times Af. Wall and roof loads are applied simultaneously.
